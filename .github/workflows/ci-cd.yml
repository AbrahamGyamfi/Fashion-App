name: Application CI/CD

on:
  push:
    branches: [dev, stage, main]
    paths:
      - 'backend/**'
      - 'frontend/**'
  pull_request:
    branches: [dev, stage, main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      
env:
  AWS_REGION: us-east-1
  NODE_VERSION: '20'

jobs:
  # CI Job - Runs on dev branch pushes and all PRs
  ci:
    name: CI - Test & Security
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Backend CI
      - name: Install Backend Dependencies
        run: npm ci
        working-directory: ./backend

      - name: Run Backend Tests
        run: npm test
        working-directory: ./backend
        continue-on-error: false

      - name: Backend Security Scan
        run: npm audit --audit-level=high
        working-directory: ./backend
        continue-on-error: false

      - name: Backend Lint
        run: npm run lint --if-present
        working-directory: ./backend
        continue-on-error: false

      # Frontend CI
      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run Frontend Tests
        run: npm test -- --passWithNoTests
        working-directory: ./frontend
        continue-on-error: false

      - name: Frontend Security Scan
        run: npm audit --omit=dev --audit-level=high
        working-directory: ./frontend
        continue-on-error: false

      - name: Frontend Lint
        run: npm run lint --if-present
        working-directory: ./frontend
        continue-on-error: false

      - name: Frontend Build Test
        run: npm run build
        working-directory: ./frontend
        env:
          CI: false

      # Security Scans
      - name: Secrets Detection - GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

      - name: SAST Scan - Semgrep (Fast Security Check)
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/security-audit
        continue-on-error: false

      - name: Code Quality - SonarCloud (Deep Analysis)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/stage' || github.ref == 'refs/heads/main')
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: CI Summary
        if: always()
        run: |
          echo "## ✅ CI Pipeline Completed" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Backend:** Tested ✓" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend:** Tested ✓" >> $GITHUB_STEP_SUMMARY
          echo "**Security:** GitLeaks ✓ | Semgrep ✓" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.event_name }}" == "push" ]] && { [[ "${{ github.ref }}" == "refs/heads/dev" ]] || [[ "${{ github.ref }}" == "refs/heads/stage" ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]]; }; then
            echo "**Code Quality:** SonarCloud ✓" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  # Build & Deploy - Only runs when PR is merged to stage or main
  build:
    name: Build & Push Docker Image
    needs: [ci]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/stage' || github.ref == 'refs/heads/main')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env=production" >> $GITHUB_OUTPUT
            echo "cluster=shopnow-production" >> $GITHUB_OUTPUT
            echo "service=shopnow-production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/stage" ]]; then
            echo "env=staging" >> $GITHUB_OUTPUT
            echo "cluster=shopnow-staging" >> $GITHUB_OUTPUT
            echo "service=shopnow-staging" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -f backend/Dockerfile.prod -t backend:${{ github.sha }} ./backend

      - name: Scan Image - Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '0'
        continue-on-error: false

      - name: Push to ECR
        run: |
          docker tag backend:${{ github.sha }} ${{ steps.ecr.outputs.registry }}/shopnow-backend:${{ github.sha }}
          docker tag backend:${{ github.sha }} ${{ steps.ecr.outputs.registry }}/shopnow-backend:${{ steps.env.outputs.env }}-latest
          docker push ${{ steps.ecr.outputs.registry }}/shopnow-backend:${{ github.sha }}
          docker push ${{ steps.ecr.outputs.registry }}/shopnow-backend:${{ steps.env.outputs.env }}-latest

      - name: Build Summary
        if: always()
        run: |
          echo "## 🐳 Docker Build Completed" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.env.outputs.env }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** shopnow-backend:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to ECS
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/stage' || github.ref == 'refs/heads/main')
    
    steps:
      - name: Determine Environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env=production" >> $GITHUB_OUTPUT
            echo "cluster=shopnow-production" >> $GITHUB_OUTPUT
            echo "service=shopnow-production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/stage" ]]; then
            echo "env=staging" >> $GITHUB_OUTPUT
            echo "cluster=shopnow-staging" >> $GITHUB_OUTPUT
            echo "service=shopnow-staging" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ steps.env.outputs.cluster }} \
            --service ${{ steps.env.outputs.service }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for Deployment
        run: |
          aws ecs wait services-stable \
            --cluster ${{ steps.env.outputs.cluster }} \
            --services ${{ steps.env.outputs.service }} \
            --region ${{ env.AWS_REGION }}

      - name: Health Check
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names shopnow-alb-${{ steps.env.outputs.env }} \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          
          echo "Testing health endpoint: http://$ALB_DNS/api/health"
          
          for i in {1..5}; do
            if curl -f http://$ALB_DNS/api/health; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "Retry $i/5..."
            sleep 10
          done
          echo "❌ Health check failed"
          exit 1

      - name: Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Deployment Completed" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.env.outputs.env }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster:** ${{ steps.env.outputs.cluster }}" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** ${{ steps.env.outputs.service }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

