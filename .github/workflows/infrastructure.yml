name: Infrastructure Deployment

on:
  push:
    branches: [main, dev]
    paths:
      - 'infrastructure/terraform/**'
  pull_request:
    branches: [main, dev]
    paths:
      - 'infrastructure/terraform/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        options: [dev, prod]
      action:
        description: 'Action'
        required: true
        type: choice
        options: [plan, apply, destroy]

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.0

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "env=dev" >> $GITHUB_OUTPUT
          else
            echo "env=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: ./infrastructure/terraform

      - name: Terraform Plan
        run: terraform plan -var-file="${{ steps.env.outputs.env }}.tfvars" -out=tfplan
        working-directory: ./infrastructure/terraform
        env:
          TF_VAR_db_password: ${{ secrets[format('{0}_DB_PASSWORD', steps.env.outputs.env == 'prod' && 'PROD' || 'DEV')] }}
          TF_VAR_redis_password: ${{ secrets[format('{0}_REDIS_PASSWORD', steps.env.outputs.env == 'prod' && 'PROD' || 'DEV')] }}
          TF_VAR_jwt_secret: ${{ secrets[format('{0}_JWT_SECRET', steps.env.outputs.env == 'prod' && 'PROD' || 'DEV')] }}
          TF_VAR_session_secret: ${{ secrets[format('{0}_SESSION_SECRET', steps.env.outputs.env == 'prod' && 'PROD' || 'DEV')] }}

      - name: Terraform Apply
        if: |
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: terraform apply -auto-approve tfplan
        working-directory: ./infrastructure/terraform
        environment:
          name: ${{ steps.env.outputs.env }}

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: terraform destroy -var-file="${{ steps.env.outputs.env }}.tfvars" -auto-approve
        working-directory: ./infrastructure/terraform
        environment:
          name: ${{ steps.env.outputs.env }}-destroy
        env:
          TF_VAR_db_password: ${{ secrets[format('{0}_DB_PASSWORD', steps.env.outputs.env == 'prod' && 'PROD' || 'DEV')] }}
          TF_VAR_redis_password: ${{ secrets[format('{0}_REDIS_PASSWORD', steps.env.outputs.env == 'prod' && 'PROD' || 'DEV')] }}
          TF_VAR_jwt_secret: ${{ secrets[format('{0}_JWT_SECRET', steps.env.outputs.env == 'prod' && 'PROD' || 'DEV')] }}
          TF_VAR_session_secret: ${{ secrets[format('{0}_SESSION_SECRET', steps.env.outputs.env == 'prod' && 'PROD' || 'DEV')] }}

      - name: Summary
        if: always()
        run: |
          echo "## 🏗️ Infrastructure Deployment" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.env.outputs.env }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
