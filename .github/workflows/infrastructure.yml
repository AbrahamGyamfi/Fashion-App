name: Infrastructure Deployment

on:
  push:
    branches: [stage, main]
    paths:
      - 'infrastructure/terraform/**'
  pull_request:
    branches: [stage, main]
    paths:
      - 'infrastructure/terraform/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        options: [staging, production]
      action:
        description: 'Action'
        required: true
        type: choice
        options: [plan, apply, destroy]

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.0

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env=production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/stage" ]]; then
            echo "env=staging" >> $GITHUB_OUTPUT
          else
            echo "env=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Create S3 Backend Bucket
        run: |
          # Check if bucket exists
          if ! aws s3 ls s3://shopnow-terraform-state 2>/dev/null; then
            echo "Creating S3 bucket for Terraform state..."
            aws s3api create-bucket \
              --bucket shopnow-terraform-state \
              --region ${{ env.AWS_REGION }}
            
            # Enable versioning
            aws s3api put-bucket-versioning \
              --bucket shopnow-terraform-state \
              --versioning-configuration Status=Enabled
            
            # Enable encryption
            aws s3api put-bucket-encryption \
              --bucket shopnow-terraform-state \
              --server-side-encryption-configuration '{
                "Rules": [{
                  "ApplyServerSideEncryptionByDefault": {
                    "SSEAlgorithm": "AES256"
                  },
                  "BucketKeyEnabled": true
                }]
              }'
            
            # Block public access
            aws s3api put-public-access-block \
              --bucket shopnow-terraform-state \
              --public-access-block-configuration \
                "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
            
            echo "✅ S3 bucket created"
          else
            echo "✅ S3 bucket already exists"
          fi

      - name: Create DynamoDB Lock Table
        run: |
          # Check if table exists
          if ! aws dynamodb describe-table --table-name shopnow-terraform-locks --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "Creating DynamoDB table for Terraform locks..."
            aws dynamodb create-table \
              --table-name shopnow-terraform-locks \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region ${{ env.AWS_REGION }}
            
            echo "Waiting for table to be active..."
            aws dynamodb wait table-exists \
              --table-name shopnow-terraform-locks \
              --region ${{ env.AWS_REGION }}
            
            echo "✅ DynamoDB table created"
          else
            echo "✅ DynamoDB table already exists"
          fi

      - name: Terraform Init
        run: terraform init
        working-directory: ./infrastructure/terraform

      - name: Create tfvars File
        run: |
          cat > ${{ steps.env.outputs.env }}.tfvars << 'EOF'
          environment = "${{ steps.env.outputs.env }}"
          aws_region  = "${{ env.AWS_REGION }}"
          vpc_cidr    = "10.0.0.0/16"
          
          db_name     = "shopnow"
          db_username = "admin"
          
          ecs_task_cpu    = "${{ steps.env.outputs.env == 'production' && '1024' || '512' }}"
          ecs_task_memory = "${{ steps.env.outputs.env == 'production' && '2048' || '1024' }}"
          
          container_port = 3000
          db_port        = 5432
          redis_port     = 6379
          
          enable_deletion_protection = ${{ steps.env.outputs.env == 'production' && 'true' || 'false' }}
          health_check_path         = "/api/health"
          
          postgres_image = "postgres:15-alpine"
          redis_image    = "redis:7-alpine"
          
          nat_instance_type = "t4g.nano"
          enable_nat_ssh    = false
          
          tags = {
            Environment = "${{ steps.env.outputs.env }}"
            ManagedBy   = "Terraform"
            Project     = "ShopNow"
          }
          EOF
        working-directory: ./infrastructure/terraform

      - name: Terraform Plan
        run: terraform plan -var-file="${{ steps.env.outputs.env }}.tfvars" -out=tfplan
        working-directory: ./infrastructure/terraform
        env:
          TF_VAR_db_password: ${{ steps.env.outputs.env == 'production' && secrets.PROD_DB_PASSWORD || secrets.STAGE_DB_PASSWORD }}
          TF_VAR_redis_password: ${{ steps.env.outputs.env == 'production' && secrets.PROD_REDIS_PASSWORD || secrets.STAGE_REDIS_PASSWORD }}
          TF_VAR_jwt_secret: ${{ steps.env.outputs.env == 'production' && secrets.PROD_JWT_SECRET || secrets.STAGE_JWT_SECRET }}
          TF_VAR_session_secret: ${{ steps.env.outputs.env == 'production' && secrets.PROD_SESSION_SECRET || secrets.STAGE_SESSION_SECRET }}

      - name: Terraform Apply
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: terraform apply -auto-approve tfplan
        working-directory: ./infrastructure/terraform

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: terraform destroy -var-file="${{ steps.env.outputs.env }}.tfvars" -auto-approve
        working-directory: ./infrastructure/terraform
        env:
          TF_VAR_db_password: ${{ steps.env.outputs.env == 'production' && secrets.PROD_DB_PASSWORD || secrets.STAGE_DB_PASSWORD }}
          TF_VAR_redis_password: ${{ steps.env.outputs.env == 'production' && secrets.PROD_REDIS_PASSWORD || secrets.STAGE_REDIS_PASSWORD }}
          TF_VAR_jwt_secret: ${{ steps.env.outputs.env == 'production' && secrets.PROD_JWT_SECRET || secrets.STAGE_JWT_SECRET }}
          TF_VAR_session_secret: ${{ steps.env.outputs.env == 'production' && secrets.PROD_SESSION_SECRET || secrets.STAGE_SESSION_SECRET }}

      - name: Summary
        if: always()
        run: |
          echo "## 🏗️ Infrastructure Deployment" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.env.outputs.env }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
