sonar.projectKey=AbrahamGyamfi_Fashion-App
sonar.organization=abrahamgyamfi

# Project metadata
sonar.projectName=ShopNow Fashion E-Commerce Platform
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=backend,frontend/src
sonar.tests=backend/__tests__,frontend/src/__tests__

# Exclusions
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/*.test.js,**/*.spec.js,**/coverage/**

# Test coverage
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info
sonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/__tests__/**

# Language-specific settings
sonar.javascript.node.maxspace=4096

# Encoding
sonar.sourceEncoding=UTF-8

# Duplications
sonar.cpd.exclusions=**/*.test.js,**/*.spec.js
