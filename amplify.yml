version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --prefix Fashion_App_Frontend
    build:
      commands:
        - npm run build --prefix Fashion_App_Frontend
  artifacts:
    baseDirectory: Fashion_App_Frontend/build
    files:
      - '**/*'
  cache:
    paths:
      - Fashion_App_Frontend/node_modules/**/*
