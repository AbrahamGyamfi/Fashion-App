version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: shopnow
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shopnow-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - shopnow-network

  product-service:
    build: ./backend/services/product-service
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/shopnow
      REDIS_URL: redis://redis:6379
      PORT: 3001
    depends_on:
      - postgres
      - redis
    networks:
      - shopnow-network

  search-service:
    build: ./backend/services/search-service
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/shopnow
      REDIS_URL: redis://redis:6379
      PORT: 3002
    depends_on:
      - postgres
      - redis
    networks:
      - shopnow-network

  cart-service:
    build: ./backend/services/cart-service
    ports:
      - "3003:3003"
    environment:
      REDIS_URL: redis://redis:6379
      PRODUCT_SERVICE_URL: http://product-service:3001
      PORT: 3003
    depends_on:
      - redis
      - product-service
    networks:
      - shopnow-network

  api-gateway:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      PRODUCT_SERVICE_URL: http://product-service:3001
      SEARCH_SERVICE_URL: http://search-service:3002
      CART_SERVICE_URL: http://cart-service:3003
      PORT: 3000
    depends_on:
      - product-service
      - search-service
      - cart-service
    networks:
      - shopnow-network

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api-gateway
    networks:
      - shopnow-network

networks:
  shopnow-network:
    driver: bridge

volumes:
  postgres_data:
